<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JARVIS | Personal AI</title>
    
    <!-- CDNs -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        /* Typography & Reset */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');
        
        :root {
            --glass-bg: rgba(30, 30, 35, 0.45);
            --glass-border: rgba(255, 255, 255, 0.12);
            --glass-highlight: rgba(255, 255, 255, 0.05);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            overflow: hidden;
            background-color: #000;
            color: white;
            -webkit-font-smoothing: antialiased;
        }

        /* Background */
        #bg-image {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://files.catbox.moe/l2qj63.jpg');
            background-size: cover;
            background-position: center;
            z-index: -2;
            transform: scale(1.05); /* Slight scale for breathing animation */
        }
        
        #bg-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.8) 100%);
            z-index: -1;
        }

        /* Glassmorphism Utilities */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 24px 40px -12px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255,255,255,0.1);
            border-radius: 24px;
        }

        .glass-input {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            color: white;
            transition: all 0.3s ease;
        }
        .glass-input:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.4);
            background: rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 15px rgba(255,255,255,0.05);
        }

        .glass-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }
        .glass-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }
        .glass-btn:active {
            transform: translateY(1px);
        }

        /* UI Containers */
        #setup-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
            padding: 20px;
        }

        #main-interface {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        #orb-container {
            width: 100%;
            height: 50vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        #orb-canvas {
            width: 300px;
            height: 300px;
            pointer-events: none;
        }

        /* Conversation Panel */
        #conversation-panel {
            width: 90%;
            max-width: 600px;
            height: 35vh;
            margin-bottom: 5vh;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 20px;
            scrollbar-width: none; /* Firefox */
            /* Fade top and bottom for premium look */
            mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
        }
        #conversation-panel::-webkit-scrollbar { display: none; }

        .message {
            margin-bottom: 16px;
            opacity: 0;
            transform: translateY(10px);
            animation: slideUpFade 0.5s ease forwards;
        }
        .msg-you {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
            font-weight: 400;
        }
        .msg-jarvis {
            color: rgba(255, 255, 255, 1);
            font-size: 1.1rem;
            font-weight: 300;
            letter-spacing: 0.3px;
        }

        @keyframes slideUpFade {
            to { opacity: 1; transform: translateY(0); }
        }

        /* Loaders & Status */
        .loader {
            border: 2px solid rgba(255,255,255,0.1);
            border-top: 2px solid white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: none;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        #status-indicator {
            position: absolute;
            top: 40px;
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.5);
            font-weight: 500;
        }

        /* Notification */
        #notification {
            position: absolute;
            top: -60px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            border-radius: 20px;
            background: rgba(255, 50, 50, 0.2);
            border: 1px solid rgba(255, 50, 50, 0.4);
            backdrop-filter: blur(10px);
            color: white;
            font-size: 0.9rem;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 100;
        }
        #notification.show { top: 40px; }

    </style>
</head>
<body>

    <!-- Background Layer -->
    <div id="bg-image"></div>
    <div id="bg-overlay"></div>

    <!-- Error Notification -->
    <div id="notification"></div>

    <!-- Setup Screen -->
    <div id="setup-screen">
        <!-- Step 1: Google API -->
        <div id="step-google" class="glass-panel w-full max-w-md p-8 flex flex-col items-center text-center">
            <h1 class="text-3xl font-light tracking-wide mb-2">JARVIS</h1>
            <p class="text-white/50 text-sm mb-8">System Initialization</p>
            
            <div class="w-full text-left mb-2">
                <label class="text-xs text-white/60 ml-2 uppercase tracking-wider">Google AI API Key</label>
            </div>
            <input type="password" id="google-key" class="glass-input w-full px-4 py-3 rounded-xl mb-6 text-sm" placeholder="AIzaSy...">
            
            <button onclick="testGoogleAPI()" class="glass-btn w-full py-3 rounded-xl flex items-center justify-center gap-2">
                <span id="btn-text-google">Connect & Next</span>
                <div id="loader-google" class="loader"></div>
            </button>
            <p class="text-[10px] text-white/30 mt-4 text-center">Keys are stored locally for this session only.<br>Never share your API keys.</p>
        </div>

        <!-- Step 2: ElevenLabs API (Initially Hidden) -->
        <div id="step-eleven" class="glass-panel w-full max-w-md p-8 flex flex-col items-center text-center hidden">
            <h2 class="text-2xl font-light mb-2">Voice Synthesis</h2>
            <p class="text-white/50 text-sm mb-8">Connect ElevenLabs</p>
            
            <div class="w-full text-left mb-2">
                <label class="text-xs text-white/60 ml-2 uppercase tracking-wider">ElevenLabs API Key</label>
            </div>
            <input type="password" id="eleven-key" class="glass-input w-full px-4 py-3 rounded-xl mb-4 text-sm" placeholder="sk_...">
            
            <div class="w-full text-left mb-2">
                <label class="text-xs text-white/60 ml-2 uppercase tracking-wider">Voice ID (Optional)</label>
            </div>
            <!-- Defaulting to a known good male voice (Antoni) for JARVIS feel -->
            <input type="text" id="eleven-voice" class="glass-input w-full px-4 py-3 rounded-xl mb-6 text-sm" placeholder="21m00Tcm4TlvDq8ikWAM" value="21m00Tcm4TlvDq8ikWAM">
            
            <button onclick="testElevenAPI()" class="glass-btn w-full py-3 rounded-xl flex items-center justify-center gap-2">
                <span id="btn-text-eleven">Initialize JARVIS</span>
                <div id="loader-eleven" class="loader"></div>
            </button>
        </div>
    </div>

    <!-- Main Interface -->
    <div id="main-interface">
        <div id="status-indicator">Idle</div>
        
        <div id="orb-container">
            <div id="orb-canvas"></div>
        </div>

        <div id="conversation-panel" class="glass-panel">
            <div class="message">
                <div class="msg-jarvis text-center text-white/50 text-sm italic mt-4">System online. Waiting for voice input...</div>
            </div>
        </div>
    </div>

    <script>
        /** 
         *  --- SECURE ARCHITECTURE NOTE ---
         *  This file is a frontend-only demonstration as requested (single HTML file).
         *  API keys are kept in variables and requests are made directly from the browser.
         *  IN PRODUCTION: Do not expose API keys here. Build a proxy backend (e.g., Node.js)
         *  that stores keys in .env, and have this frontend fetch your backend endpoint.
         */

        // --- State & Variables ---
        let config = { google: '', eleven: '', voiceId: '21m00Tcm4TlvDq8ikWAM' };
        let orbState = 'idle'; // idle, listening, thinking, speaking
        let conversationHistory = [
            { role: "user", parts: [{ text: "You are JARVIS, a highly advanced, concise, and helpful AI assistant. You speak English, Urdu, and Punjabi. Keep answers brief and conversational." }] }
        ];

        // --- Audio Context for Speech ---
        let audioContext;
        let analyser;
        let dataArray;
        let isSpeaking = false;

        // --- Three.js AI Orb Setup ---
        const initOrb = () => {
            const container = document.getElementById('orb-canvas');
            const scene = new THREE.Scene();
            
            // Camera
            const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
            camera.position.z = 4;

            // Renderer - transparent background
            const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(300, 300);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            // Lighting to create liquid glass effect
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 2);
            dirLight.position.set(2, 2, 2);
            scene.add(dirLight);

            const backLight = new THREE.DirectionalLight(0x88ccff, 3); // Subtle blue/cyan rim light
            backLight.position.set(-2, -2, -2);
            scene.add(backLight);

            // Geometry - high segment sphere for vertex displacement
            const geometry = new THREE.SphereGeometry(1.2, 64, 64);
            
            // Material - Liquid Glass look
            const material = new THREE.MeshPhysicalMaterial({
                color: 0x222222,
                metalness: 0.1,
                roughness: 0.1,
                transmission: 0.9, // glass effect
                thickness: 0.5,
                ior: 1.5,
                emissive: 0x112233,
                emissiveIntensity: 0.2,
                clearcoat: 1.0,
                clearcoatRoughness: 0.1
            });

            const sphere = new THREE.Mesh(geometry, material);
            scene.add(sphere);

            // Save original vertices for animation
            const positionAttribute = geometry.attributes.position;
            const vertexData = [];
            for (let i = 0; i < positionAttribute.count; i++) {
                vertexData.push({
                    x: positionAttribute.getX(i),
                    y: positionAttribute.getY(i),
                    z: positionAttribute.getZ(i),
                    ang: Math.random() * Math.PI * 2,
                    amp: 0
                });
            }

            // Animation Loop
            let time = 0;
            const animate = () => {
                requestAnimationFrame(animate);
                time += 0.03;
                
                // Adjust animation parameters based on state
                let targetEmissive = 0x112233;
                let intensity = 0.2;
                let speed = 1;
                let baseDeformation = 0.05;

                if (orbState === 'listening') {
                    targetEmissive = 0x225588;
                    intensity = 0.8;
                    speed = 2.5;
                    baseDeformation = 0.1;
                } else if (orbState === 'thinking') {
                    targetEmissive = 0x553388;
                    intensity = 1.0;
                    speed = 4;
                    baseDeformation = 0.15;
                } else if (orbState === 'speaking') {
                    targetEmissive = 0x3388aa;
                    intensity = 0.8;
                    
                    // Reactive audio logic
                    let audioMod = 0;
                    if (isSpeaking && analyser && dataArray) {
                        analyser.getByteFrequencyData(dataArray);
                        // Get average volume
                        let sum = 0;
                        for(let i=0; i<dataArray.length; i++) sum += dataArray[i];
                        let avg = sum / dataArray.length;
                        audioMod = avg / 255; // 0 to 1
                    }
                    baseDeformation = 0.1 + (audioMod * 0.3);
                    speed = 2 + (audioMod * 2);
                    sphere.scale.setScalar(1 + (audioMod * 0.15));
                } else {
                    // idle
                    sphere.scale.setScalar(1);
                }

                // Smoothly interpolate emissive color
                material.emissive.lerp(new THREE.Color(targetEmissive), 0.05);
                material.emissiveIntensity += (intensity - material.emissiveIntensity) * 0.1;

                // Vertex displacement for liquid feel
                for (let i = 0; i < positionAttribute.count; i++) {
                    const v = vertexData[i];
                    
                    // Complex sine waves for organic movement
                    const offset = Math.sin(v.x * 3 + time * speed) * 
                                   Math.cos(v.y * 3 + time * speed * 0.8) * 
                                   Math.sin(v.z * 3 + time * speed * 1.2);
                    
                    const normalize = new THREE.Vector3(v.x, v.y, v.z).normalize();
                    const disp = baseDeformation * offset;
                    
                    positionAttribute.setXYZ(i, 
                        v.x + normalize.x * disp,
                        v.y + normalize.y * disp,
                        v.z + normalize.z * disp
                    );
                }
                
                geometry.computeVertexNormals();
                positionAttribute.needsUpdate = true;
                
                // Rotation
                sphere.rotation.y += 0.005;
                sphere.rotation.z += 0.002;

                renderer.render(scene, camera);
            };
            
            animate();
        };

        // --- Setup Flow Logic ---
        
        const showNotification = (msg) => {
            const el = document.getElementById('notification');
            el.innerText = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 3000);
        };

        const setLoading = (step, isLoading) => {
            document.getElementById(`btn-text-${step}`).style.display = isLoading ? 'none' : 'block';
            document.getElementById(`loader-${step}`).style.display = isLoading ? 'block' : 'none';
        };

        async function testGoogleAPI() {
            const key = document.getElementById('google-key').value.trim();
            if(!key) return showNotification("Please enter a Google API Key");
            
            setLoading('google', true);
            
            try {
                // Lightweight test call to Gemini API to verify key
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`;
                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: "ping" }] }] })
                });

                if(!res.ok) throw new Error("Invalid API Key or connection failed.");
                
                config.google = key;
                
                // Transition to ElevenLabs Step
                gsap.to("#step-google", { opacity: 0, y: -20, duration: 0.4, onComplete: () => {
                    document.getElementById('step-google').classList.add('hidden');
                    document.getElementById('step-eleven').classList.remove('hidden');
                    gsap.fromTo("#step-eleven", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4 });
                }});

            } catch (err) {
                showNotification("Connection failed. Check API key.");
            } finally {
                setLoading('google', false);
            }
        }

        async function testElevenAPI() {
            const key = document.getElementById('eleven-key').value.trim();
            let vId = document.getElementById('eleven-voice').value.trim();
            if(!key) return showNotification("Please enter an ElevenLabs API Key");
            if(!vId) vId = "21m00Tcm4TlvDq8ikWAM"; // fallback
            
            setLoading('eleven', true);
            
            try {
                // Test call to ElevenLabs (Get voices list to verify key)
                const res = await fetch('https://api.elevenlabs.io/v1/voices', {
                    method: 'GET',
                    headers: { 'xi-api-key': key }
                });

                if(!res.ok) throw new Error("Invalid API Key.");
                
                config.eleven = key;
                config.voiceId = vId;
                
                startMainInterface();

            } catch (err) {
                showNotification("Voice connection failed. Check key.");
            } finally {
                setLoading('eleven', false);
            }
        }

        // --- Main Interface Transition & Setup ---
        
        function startMainInterface() {
            // Init Audio Context on user interaction (required by browsers)
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioContext = new AudioContext();
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 256;
            dataArray = new Uint8Array(analyser.frequencyBinCount);

            // GSAP Transition
            gsap.to("#setup-screen", { 
                opacity: 0, 
                duration: 1, 
                backdropFilter: "blur(0px)",
                onComplete: () => {
                    document.getElementById('setup-screen').style.display = 'none';
                    document.getElementById('main-interface').style.display = 'flex';
                    
                    initOrb();
                    
                    // Bg breathing animation
                    gsap.to("#bg-image", { scale: 1.0, duration: 10, repeat: -1, yoyo: true, ease: "sine.inOut" });
                    
                    // Welcome Confetti (subtle)
                    confetti({ particleCount: 50, spread: 60, origin: { y: 0.8 }, colors: ['#ffffff', '#88ccff'] });

                    // Start AI Loop
                    setTimeout(startListening, 1500);
                }
            });
        }

        // --- AI Logic & Conversation ---

        function updateStatus(stateStr) {
            orbState = stateStr.toLowerCase();
            document.getElementById('status-indicator').innerText = stateStr.toUpperCase();
        }

        function appendMessage(sender, text) {
            const panel = document.getElementById('conversation-panel');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message';
            
            if(sender === 'You') {
                msgDiv.innerHTML = `<div class="msg-you">You: "${text}"</div>`;
            } else {
                msgDiv.innerHTML = `<div class="msg-jarvis">JARVIS: "${text}"</div>`;
            }
            
            panel.appendChild(msgDiv);
            panel.scrollTop = panel.scrollHeight;
        }

        // 1. Listen (Web Speech API)
        function startListening() {
            if (!('webkitSpeechRecognition' in window)) {
                showNotification("Speech Recognition not supported in this browser.");
                return;
            }

            const recognition = new webkitSpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            // Using a broad language setting. It attempts to phonetically capture mixed languages.
            recognition.lang = 'en-US'; 

            recognition.onstart = () => {
                updateStatus('Listening');
            };

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                appendMessage('You', transcript);
                processAI(transcript);
            };

            recognition.onerror = (event) => {
                console.warn(event.error);
                if (event.error === 'no-speech') {
                    // Just restart listening if quiet
                    setTimeout(startListening, 1000);
                } else {
                    updateStatus('Idle');
                    showNotification("Mic error: " + event.error);
                }
            };

            recognition.onend = () => {
                // If it ended without going to thinking (e.g. no speech), reset to idle
                if(orbState === 'listening') updateStatus('Idle');
            };

            try {
                recognition.start();
            } catch (e) {
                console.error(e);
            }
        }

        // 2. Think (Google Gemini API)
        async function processAI(userText) {
            updateStatus('Thinking');
            
            conversationHistory.push({ role: "user", parts: [{ text: userText }] });

            try {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${config.google}`;
                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: conversationHistory })
                });

                if(!res.ok) throw new Error("API failed");
                const data = await res.json();
                
                let reply = data.candidates[0].content.parts[0].text;
                
                // Clean markdown artifacts (asterisks) for speech and clean display
                reply = reply.replace(/[*#]/g, '').trim();

                conversationHistory.push({ role: "model", parts: [{ text: reply }] });
                
                appendMessage('JARVIS', reply);
                speak(reply);

            } catch (err) {
                console.error(err);
                showNotification("Processing failed. Retrying...");
                updateStatus('Idle');
                setTimeout(startListening, 2000);
            }
        }

        // 3. Speak (ElevenLabs API)
        async function speak(text) {
            updateStatus('Speaking');
            
            try {
                const res = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${config.voiceId}?output_format=mp3_44100_128`, {
                    method: 'POST',
                    headers: {
                        'xi-api-key': config.eleven,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        text: text,
                        model_id: "eleven_multilingual_v2" // Good for mixed languages (Urdu/Punjabi/Eng)
                    })
                });

                if(!res.ok) throw new Error("TTS failed");

                const arrayBuffer = await res.arrayBuffer();
                
                // Decode audio data for visualizer
                audioContext.decodeAudioData(arrayBuffer, (buffer) => {
                    const source = audioContext.createBufferSource();
                    source.buffer = buffer;
                    
                    // Connect to analyser for orb visual, then to destination (speakers)
                    source.connect(analyser);
                    analyser.connect(audioContext.destination);
                    
                    isSpeaking = true;
                    source.start(0);

                    source.onended = () => {
                        isSpeaking = false;
                        updateStatus('Idle');
                        // Continuous loop: listen again
                        setTimeout(startListening, 500);
                    };
                });

            } catch (err) {
                console.error(err);
                showNotification("Voice generation failed.");
                updateStatus('Idle');
                setTimeout(startListening, 2000);
            }
        }

    </script>
</body>
</html>
